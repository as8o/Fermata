name: Build F1 test APK

on:
  push:
    branches: [feature/android-auto-f1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: F1 arm64 Android Auto APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NO_GS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Build F1 universal APK with all feature modules
        run: |
          chmod +x gradlew
          ./gradlew :fermata:packageAutoReleaseUniversalApk --build-cache \
            -PABI=arm64-v8a -PAPP_ID_SFX=.f1 -PAPP_NAME=F1
      - name: Verify package identity and signature
        run: |
          mkdir -p dist
          cp fermata/build/outputs/apk_from_bundle/autoRelease/*.apk dist/F1-arm64.apk
          tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools_dir/aapt" dump badging dist/F1-arm64.apk > dist/apk-badging.txt
          grep -F "name='me.aap.fermata.auto.f1'" dist/apk-badging.txt
          grep -F "application-label:'F1'" dist/apk-badging.txt
          "$tools_dir/apksigner" verify --verbose --print-certs dist/F1-arm64.apk > dist/apk-signature.txt
          git rev-parse HEAD > dist/source-commit.txt
          sha256sum dist/F1-arm64.apk > dist/SHA256SUMS
          cp docs/F1-testing.md dist/
      - uses: actions/upload-artifact@v4
        with:
          name: F1-arm64-test-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
